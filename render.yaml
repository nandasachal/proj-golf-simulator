# The leaderboard API and its database. The static site is managed in the
# Render dashboard, not here.
databases:
  - name: golf-leaderboard-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 1

services:
  - type: web
    name: golf-leaderboard-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    numInstances: 1 # rate limits are in memory
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: golf-leaderboard-db
          property: connectionString
      # Our own account names, comma-separated: set in the dashboard.
      - key: INTERNAL_NAMES
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
