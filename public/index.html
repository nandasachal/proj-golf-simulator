    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A 3D golf swing simulator: set the club face, path and speed, and see the shot."
    />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Golf Swing Simulator</title>
    <!-- The loading screen is plain HTML and CSS so it paints before the
         script runs. Its bar moves by transform only, which the browser keeps
         animating while the main thread is busy building the range. -->
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: linear-gradient(#0e2318 0%, #1c4429 62%, #2a5c35 100%);
        color: #f1f5f2;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        transition: opacity 0.4s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #loading p {
        margin: 0;
        font-size: 14px;
        color: rgba(241, 245, 242, 0.72);
      }
      #loading .track {
        width: min(240px, 70vw);
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      #loading .track i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #a3e635;
        animation: loading-slide 1.2s ease-in-out infinite alternate;
        will-change: transform;
      }
      @keyframes loading-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(150%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .track i {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4631919395799165"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to rhelloun this app.</noscript>
    <div id="root"></div>
    <div id="loading" role="status" aria-live="polite">
      <h1>Golf Swing Simulator</h1>
      <div class="track"><i></i></div>
      <p>Building the range…</p>
    </div>
